name: CI Checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bash-checks:
    name: Bash Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show scripts directory
        run: ls -la scripts

      - name: Check Bash script syntax
        run: |
          bash -n scripts/system_report.sh
          bash -n scripts/resource_check.sh
          bash -n scripts/deploy-infra-monitor.sh
          bash -n scripts/monitoring_health_check.sh

      - name: Confirm Bash checks passed
        run: echo "Bash syntax checks passed"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: bash-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Docker version
        run: docker --version

      - name: Show Docker files
        run: ls -la docker

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t infra-monitor .

      - name: Verify container runtime dependencies
        run: |
          docker run \
            --rm \
            --entrypoint sh \
            infra-monitor \
            -c '
              set -eu

              command -v ip
              command -v aws
              command -v ps
              command -v top
              command -v df

              ip -brief addr show >/dev/null

              echo "Infra Monitor runtime dependencies verified"
            '

      - name: Confirm Docker build passed
        run: echo "Docker image built successfully"
        
  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Docker Compose version
        run: docker compose version

      - name: Create CI runtime environment
        run: |
          cat > docker/runtime.env <<'EOF'
          INFRA_MONITOR_CPU_THRESHOLD=70
          INFRA_MONITOR_MEMORY_THRESHOLD=70
          INFRA_MONITOR_DISK_THRESHOLD=70
          INFRA_MONITOR_MAX_LOG_SIZE=50000

          INFRA_MONITOR_SYSTEM_LOG=/app/logs/ci-system-report.log
          INFRA_MONITOR_ERROR_LOG=/app/logs/ci-error.log

          INFRA_MONITOR_METRICS_DIR=/app/metrics
          INFRA_MONITOR_HOST_ROOT=/host

          INFRA_MONITOR_S3_BUCKET=
          INFRA_MONITOR_S3_KEY=system_report.log
          EOF

          chmod 600 docker/runtime.env

      - name: Create CI Grafana environment
        run: |
          mkdir -p "$HOME/.config/infra-monitor"

          cat > "$HOME/.config/infra-monitor/grafana.env" <<'EOF'
          GF_SECURITY_ADMIN_USER=admin
          GF_SECURITY_ADMIN_PASSWORD=ci-only-placeholder-not-a-real-secret
          EOF
          
          chmod 600 "$HOME/.config/infra-monitor/grafana.env"

      - name: Validate Docker Compose file
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Test runtime environment configuration
        run: |
          set -euo pipefail

          sudo mkdir -p logs
          sudo chown root:root logs
          sudo chmod 755 logs

          docker compose \
            -f docker/docker-compose.yml \
            build infra-monitor

          docker compose \
            -f docker/docker-compose.yml \
            run --rm infra-monitor

          test -f logs/ci-system-report.log

          grep -Fq \
            "Thresholds: CPU=70% Memory=70% Disk=70%" \
            logs/ci-system-report.log

          RUNNER_HOSTNAME="$(hostname)"

          grep -Fq \
            "Hostname: $RUNNER_HOSTNAME" \
            logs/ci-system-report.log

          grep -Fq \
            "Disk Usage (Host Root)" \
            logs/ci-system-report.log

          echo "Host-aware monitoring verified successfully"

          echo "Runtime environment variables verified successfully"


      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.13.2 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Grafana dashboard JSON
        run: |
          python3 -m json.tool \
            monitoring/grafana/dashboards/infra-overview.json \
            > /dev/null

          python3 - <<'PY'
          import json

          path = "monitoring/grafana/dashboards/infra-overview.json"

          with open(path) as f:
              dashboard = json.load(f)

          expected_title = "Infra Monitor — EC2 Overview"
          expected_uid = "infra-monitor-ec2-overview"

          if dashboard.get("title") != expected_title:
              raise SystemExit(
                  f"Unexpected dashboard title: {dashboard.get('title')}"
              )

          if dashboard.get("uid") != expected_uid:
              raise SystemExit(
                  f"Unexpected dashboard UID: {dashboard.get('uid')}"
              )

          panels = dashboard.get("panels", [])

          if len(panels) < 11:
              raise SystemExit(
                  f"Expected at least 11 panels, found {len(panels)}"
              )

          expected_panels = {
              "CPU Utilisation",
              "Memory Utilisation",
              "Root Disk Usage",
              "Prometheus Target Status",
              "Network Received",
              "Network Transmitted",
              "Available Memory",
              "System Uptime",
              "Time Since Last Successful Report",
              "Infra Monitor Warning State",
              "Infra Monitor Report Status",
          }

          actual_panels = {
              panel.get("title")
              for panel in panels
          }

          missing = expected_panels - actual_panels

          if missing:
              raise SystemExit(
                  f"Missing dashboard panels: {sorted(missing)}"
              )

          print(
              f"Grafana dashboard valid: "
              f"{len(panels)} panels"
          )
          PY

      - name: Confirm configuration checks passed
        run: echo "Docker Compose, Prometheus, and Grafana validation passed"


  monitoring-integration:
    name: Monitoring Integration Checks
    runs-on: ubuntu-latest
    needs: docker-compose-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create CI runtime environment
        run: |
          cat > docker/runtime.env <<'EOF'
          INFRA_MONITOR_CPU_THRESHOLD=70
          INFRA_MONITOR_MEMORY_THRESHOLD=70
          INFRA_MONITOR_DISK_THRESHOLD=70
          INFRA_MONITOR_MAX_LOG_SIZE=50000
          INFRA_MONITOR_SYSTEM_LOG=/app/logs/ci-system-report.log
          INFRA_MONITOR_ERROR_LOG=/app/logs/ci-error.log
          INFRA_MONITOR_METRICS_DIR=/app/metrics
          INFRA_MONITOR_S3_BUCKET=
          INFRA_MONITOR_S3_KEY=system_report.log
          EOF

          chmod 600 docker/runtime.env

      - name: Prepare CI log directory
        run: |
          sudo mkdir -p logs
          sudo chown root:root logs
          sudo chmod 755 logs

      - name: Create CI Grafana environment
        run: |
          mkdir -p "$HOME/.config/infra-monitor"

          cat > "$HOME/.config/infra-monitor/grafana.env" <<'EOF'
          GF_SECURITY_ADMIN_USER=admin
          GF_SECURITY_ADMIN_PASSWORD=ci-only-placeholder-not-a-real-secret
          EOF

          chmod 600 "$HOME/.config/infra-monitor/grafana.env"

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            config --quiet

      - name: Start monitoring integration stack
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            up -d --build

      - name: Show initial Compose state
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            ps -a

      - name: Run monitoring health checks
        run: |
          bash scripts/monitoring_health_check.sh

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo "=== COMPOSE STATE ==="
          docker compose \
            -f docker/docker-compose.yml \
            ps -a || true

          echo "=== INFRA MONITOR LOGS ==="
          docker logs \
            --tail 100 \
            infra-monitor-compose || true

          echo "=== NODE EXPORTER LOGS ==="
          docker logs \
            --tail 100 \
            node-exporter || true

          echo "=== PROMETHEUS LOGS ==="
          docker logs \
            --tail 100 \
            prometheus || true

          echo "=== GRAFANA LOGS ==="
          docker logs \
            --tail 100 \
            grafana || true

      - name: Clean up integration stack
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            down -v --remove-orphans


  deploy-to-ec2:
    name: Deploy To EC2
    runs-on: ubuntu-latest
    needs: monitoring-integration

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get GitHub runner public IP
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "Runner IP: $RUNNER_IP"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      - name: Allow temporary SSH access from GitHub runner
        run: |
          RUNNER_CIDR="${{ steps.runner-ip.outputs.runner_ip }}/32"

          echo "Adding temporary SSH rule for $RUNNER_CIDR"

          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" 2>err.log || {
              if grep -q "InvalidPermission.Duplicate" err.log; then
                echo "Temporary SSH rule already exists"
              else
                cat err.log
                exit 1
              fi
            }

          sleep 10

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/infra-monitor-key.pem
          chmod 600 ~/.ssh/infra-monitor-key.pem

      - name: Add EC2 host to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deployment script on EC2
        run: |
          ssh \
            -i ~/.ssh/infra-monitor-key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            '
              set -euo pipefail

              cd "$HOME/infra-monitor"

              git fetch origin main
              git reset --hard origin/main

              bash scripts/deploy-infra-monitor.sh
            '

      - name: Remove temporary SSH access
        if: always()
        run: |
          RUNNER_CIDR="${{ steps.runner-ip.outputs.runner_ip }}/32"

          echo "Removing temporary SSH rule for $RUNNER_CIDR"

          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" || true
