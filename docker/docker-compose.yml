services:
  infra-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: infra-monitor
    container_name: infra-monitor-compose
    env_file:
      - day9.env
    volumes:
      - ../logs:/app/logs

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    command:
      - "--path.rootfs=/host"
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
